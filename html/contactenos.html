<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctenos - Carajillo</title>
    <link rel="stylesheet" href="../css/contactenos.css">
    <script src="../js/contactenos.js"></script>
</head>
<body>

    <header>
        <h1>Contáctenos</h1>
    </header>

    <main>
       <section class="info-contacto">

    <div class="logo-contacto">
        <img src="../Imgs/Logo.jpeg" alt="Carajillo Logo">
    </div>

    <h2>Información de Contacto</h2>

    <p><strong>Dirección:</strong> Tegucigalpa, Honduras</p>
    <p><strong>Teléfono:</strong> +504 9999-9999</p>
    <p><strong>Correo:</strong> Andreah@eliteprogcs.com</p>
    <p><strong>Horario:</strong> Lunes a Viernes: 8:00 AM - 7:00 PM 
    <p>   Sabado: 8:00 AM - 1:00 AM </p>
    <p>   Domingo: 8:00 AM - 3:00 PM </p>

    </p>

</section>

        <section>
            <h2>Formulario de Contacto</h2>
            <form id="formContacto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"></textarea>

                <button type="submit">Enviar</button>
                <p id="respuestaFormulario"></p>
            </form>
        </section>
    </main>

    <footer>
       <p>&copy; 2026 Carajillo</p>
    </footer>

    
</body>
</html>
