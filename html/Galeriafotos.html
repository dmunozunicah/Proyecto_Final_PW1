<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería - Carajillo</title>
  <link rel="stylesheet" href="../css/Galeriafotos.css">
<script src="../js/galeriafotos.js"></script>
</head>
<body>

  <header>
    <div class="header-content">
      <img src="../RUTA/DEL/LOGO.jpg" alt="Logo Carajillo" class="logo">
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Galería de Fotos</h1>
      <p>Descubre momentos, platillos y espacios que hacen única la experiencia Carajillo.</p>
    </div>
  </section>

  <main class="contenedor">
    <section class="galeria-section">
      <h2>Nuestros Espacios y Sabores</h2>
      <p class="intro">
        Explora una selección de imágenes de nuestro restaurante, platillos especiales,
        bebidas y eventos.
      </p>

      <div class="galeria">
        <div class="item-galeria">
          <img src="../RUTA/IMAGEN1.jpg" alt="Imagen 1">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN2.jpg" alt="Imagen 2">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN3.jpg" alt="Imagen 3">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN4.jpg" alt="Imagen 4">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN5.jpg" alt="Imagen 5">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN6.jpg" alt="Imagen 6">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN7.jpg" alt="Imagen 7">
        </div>

        <div class="item-galeria">
          <img src="../RUTA/IMAGEN8.jpg" alt="Imagen 8">
        </div>
      </div>
    </section>
  </main>

  <div class="visor" id="visor">
    <span class="cerrar" id="cerrarVisor">&times;</span>
    <img class="visor-img" id="imagenVisor" src="" alt="Vista ampliada">
  </div>

  <footer>
    <p>© 2026 Carajillo</p>
  </footer>
</body>
</html>
